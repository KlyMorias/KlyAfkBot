name: AFK Bot Host
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Install Dependencies
        # Burayı güncelledim: Eksik paketleri tek tek zorla kuruyor
        run: |
          npm install @discordjs/voice discord.js-selfbot-v13 libsodium-wrappers opusscript debug werift-rtp

      - name: Run Bot
        run: node index.js
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
